<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>citysim</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">citysim <span class="tag">S0</span></div>
        <div class="stat"><label>Date</label><output id="date">—</output></div>
        <div class="stat"><label>Funds</label><output id="funds">—</output></div>
        <div class="stat"><label>Population</label><output id="pop">—</output></div>
        <div class="stat"><label>Jobs</label><output id="jobs">—</output></div>
        <div class="stat"><label>Power</label><output id="power">—</output></div>
        <div class="stat"><label>Water</label><output id="water">—</output></div>
        <div class="stat"><label>Sewage</label><output id="sewage">—</output></div>
        <div class="stat"><label>Refuse</label><output id="waste">—</output></div>
        <div class="rci" title="Residential / Commercial / Industrial demand">
          <div class="rci-bar"><span id="rci-r"></span></div>
          <div class="rci-bar"><span id="rci-c"></span></div>
          <div class="rci-bar"><span id="rci-i"></span></div>
          <div class="rci-labels"><b>R</b><b>C</b><b>I</b></div>
        </div>
        <div class="speeds" id="speeds"></div>
        <button id="ach-open" class="help" title="Achievements (A)" aria-label="Achievements">★</button>
        <button id="manual-open" class="help" title="Manual (? or H)" aria-label="Open the manual">?</button>
      </header>

      <div id="tabs" role="tablist"></div>
      <nav id="tools"></nav>

      <main id="stage">
        <canvas id="view"></canvas>
        <canvas id="view3d" hidden></canvas>
        <button id="view-toggle" title="Switch view (Tab)">Plan</button>
        <div id="ticker"></div>
        <div id="hint">Drag to build · Right-drag or Space+drag to pan · Scroll to zoom · Tab for ¾ view</div>
      </main>

      <aside id="panel">
        <section>
          <h2>Inspect</h2>
          <div id="why" class="why">Click a tile to see why it is the way it is.</div>
        </section>
        <section>
          <h2>History</h2>
          <canvas id="chart"></canvas>
          <div class="series" id="series"></div>
          <dl class="stats" id="series-now"></dl>
        </section>
        <section>
          <h2>Data layers
            <button id="layer-multi" class="mini-toggle" aria-pressed="false"
              title="Show several layers at once, coloured by whichever is strongest">Combine</button>
          </h2>
          <div class="layers" id="layers"></div>
          <div class="layer-legend" id="layer-legend" hidden></div>
        </section>
        <section>
          <h2>Budget</h2>
          <dl class="stats" id="budget"></dl>
          <div class="taxes" id="taxes"></div>
        </section>
        <section>
          <h2>Disasters</h2>
          <div id="disaster-opts"></div>
          <p class="opt-note" id="disaster-note">Nothing has gone wrong yet.</p>
        </section>
        <section>
          <h2>City</h2>
          <div class="rowbtns">
            <button id="btn-undo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
            <button id="btn-redo" title="Redo (Cmd/Ctrl+Shift+Z)">Redo</button>
          </div>
          <div class="rowbtns">
            <button id="btn-save">Save</button>
            <button id="btn-load">Load</button>
            <button id="btn-new">New</button>
          </div>
          <label class="toggle"><input type="checkbox" id="opt-flat"> <span>New map is flat (no water)</span></label>
          <p class="opt-note" id="save-note">—</p>
        </section>
      </aside>
    </div>

    <div id="achievements" hidden>
      <div class="manual-backdrop" data-close-ach></div>
      <div class="manual-dialog" role="dialog" aria-modal="true" aria-label="Achievements">
        <header>
          <h1>Achievements <span id="ach-count" class="tag"></span></h1>
          <button id="ach-close" aria-label="Close">✕</button>
        </header>
        <div class="ach-body" id="ach-body"></div>
      </div>
    </div>

    <div id="manual" hidden>
      <div class="manual-backdrop" data-close></div>
      <div class="manual-dialog" role="dialog" aria-modal="true" aria-label="Manual">
        <header>
          <h1>Manual</h1>
          <button id="manual-close" aria-label="Close">✕</button>
        </header>
        <div class="manual-body">
          <nav id="manual-nav"></nav>
          <article id="manual-content"></article>
        </div>
      </div>
    </div>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
