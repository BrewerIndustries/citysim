name: Deploy to GitHub Pages

# Publishes BOTH versions to one Pages site:
#   main -> /        (prod)   https://citysim.dabrewer.dev/
#   dev  -> /dev/    (dev)    https://citysim.dabrewer.dev/dev/
# Lives on the dev branch only; it checks out both branches itself and builds the
# Vite app for each with the matching base path. Pushing to main does not
# auto-redeploy — re-run via "Run workflow" or push to dev.
#
# This is the free browser build: the demo and the dev target. The paid product
# ships to Steam via Electron (docs/TECH-STACK.md).

# DISABLED on push: GitHub Pages is not available for a private repo on the free plan
# (the API returns 422 "Your current plan does not support GitHub Pages"). Re-enable the
# push trigger when the repo goes public or the account upgrades; until then the web
# demo ships via itch.io (.github/workflows/itch.yml).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------- PROD (main -> /) ----------
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod-src
        continue-on-error: true
      - name: Build prod
        id: prod
        working-directory: prod-src
        env:
          BASE_PATH: /
        run: |
          npm install
          npm run build
        continue-on-error: true
      - name: Assemble prod into site root
        run: |
          mkdir -p _site
          if [ -d prod-src/dist ]; then
            cp -r prod-src/dist/. _site/
            cp _site/index.html _site/404.html
          else
            echo "main has no build yet — dev-only deploy" > _site/index.html
          fi

      # ---------- DEV (dev -> /dev/) ----------
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src
      - name: Build dev
        working-directory: dev-src
        env:
          BASE_PATH: /dev/
        run: |
          npm install
          npm run build
      - name: Assemble dev into /dev
        run: |
          mkdir -p _site/dev
          cp -r dev-src/dist/. _site/dev/
          cp _site/dev/index.html _site/dev/404.html

      - name: Set custom domain
        run: echo "citysim.dabrewer.dev" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
